# All of yokoten's CI in one workflow, so one job, `ci`, can wait for the rest: `needs`
# only reaches jobs in the same workflow. The ruleset on main requires `ci` alone, and
# adding or renaming a job here never changes what it names. The file keeps the kit's
# name, so `init` on this repo finds it and adds no second copy.
name: yokoten
on:
  pull_request:
  # Each test runs once before a merge (#1084). A pull request runs what only another
  # system or Node shows: Windows, one macOS job and Linux on Node 22. Its merge queue
  # group runs what must hold on the merged main: Linux on Node 24, all three shards.
  # Both run typecheck, check, lint and action. Turn the queue on in the repo settings.
  merge_group:
  push:
    branches: [main]
  # The full matrix, macOS shards included, runs on main every day: a pull request
  # runs one macOS job, so the shared runners stay free (#568).
  schedule:
    - cron: '17 5 * * *'
# No job gets a permission it does not name.
permissions: {}
# A newer run cancels the one still going for the same pull request: only its newest
# commit can merge. Every other event gets a group of its own, so a run on main is never
# cancelled, waiting or running: every commit stays in history (#660, #798).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Which files the pull request changes (#438). It is docs-only when each file is under
  # docs/ or changes/, or is a Markdown file outside kit/ and .github/ that is not an
  # AGENTS.md (#1051). Then one test job runs the tests that read the docs, and the jobs
  # that Markdown can't break are skipped. A merge queue group reads its files the same way:
  # the group's base to its head is the pull request's change (#1068). A push to main is a
  # full run. So is a file list that can't be read: docs_only is true only when the list
  # was read and every file fits.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
    steps:
      # The whole history, so the base commit is there to compare with. A failed checkout
      # does not stop the job: the diff below then fails, and the run is full.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          docs_only=false
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            echo "Not a pull request or a merge queue group, so every job runs."
          elif [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" --) || [ -z "$files" ]; then
            echo "::warning::The pull request's changed files could not be read, so every job runs."
          else
            docs_only=true
            while IFS= read -r file; do
              case "$file" in
                kit/*|.github/*|AGENTS.md|*/AGENTS.md) docs_only=false ;;
                docs/*|changes/*|*.md) ;;
                *) docs_only=false ;;
              esac
            done <<< "$files"
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  # On a docs-only pull request, ubuntu and Node 24 only: the architecture and
  # translation tests read the docs. `!cancelled()`: if `changes` failed, run in full.
  # Each setup runs in three shards, a third of the test files each, so a pull request
  # waits for the slowest third, not the whole suite (#472). `fail-fast: false`: one red
  # shard does not cancel the others, so a run shows every failure at once.
  # macOS is the exception: its runners are few and shared, and three shards on every
  # pull request queued until they timed out (#568). So a pull request runs the whole
  # suite in one macOS job (`of: 1`), and the full three-shard macOS matrix runs on
  # push to main and on the daily schedule.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: ${{ fromJSON(needs.changes.outputs.docs_only == 'true' && '[1]' || '[1, 2, 3]') }}
        of: ${{ fromJSON(needs.changes.outputs.docs_only == 'true' && '[1]' || '[3]') }}
        # The oldest Node yokoten supports (package.json "engines": the first 22 with the
        # security fixes of 2026-10-21, #572), and the current LTS from its first fixed release.
        # A pull request runs Linux on Node 22 and its merge queue group on Node 24, so
        # neither runs twice; a push to main and the schedule run both (#1084).
        node: ${{ fromJSON((needs.changes.outputs.docs_only == 'true' || github.event_name == 'merge_group') && '["^24.22.1"]' || github.event_name == 'pull_request' && '["22.23.4"]' || '["22.23.4","^24.22.1"]') }}
        # One macOS run: paths there go through symlinks (/var), which hid a real bug (#1).
        # None in a merge queue group: the pull request ran it.
        include: ${{ fromJSON((needs.changes.outputs.docs_only == 'true' || github.event_name == 'merge_group') && '[]' || github.event_name == 'pull_request' && '[{"os":"macos-latest","node":"^24.22.1","shard":1,"of":1}]' || '[{"os":"macos-latest","node":"^24.22.1","shard":1,"of":3},{"os":"macos-latest","node":"^24.22.1","shard":2,"of":3},{"os":"macos-latest","node":"^24.22.1","shard":3,"of":3}]') }}
    runs-on: ${{ matrix.os }}
    # 15 minutes: the whole-suite macOS job's time budget fails past 600 s of tests, and the job
    # must outlive that, or a slow suite is killed with no list of the slowest tests (#943). The
    # Linux shards take about 3 minutes; their own budget still fails them past 270 s or less.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Four files at a time (Node's default is the CPU count minus one), and one compile
      # cache for every child node, so each test file strips its TypeScript once (#442).
      # The spec reporter on every Node, so the logs read alike (Node 22 defaults to TAP).
      # A TAP copy of the report goes to a file, for the time check below.
      # A docs-only pull request runs only the tests that read the docs (#1051). A push to
      # main runs the whole suite after the merge, so a miss shows on main the same hour.
      - if: needs.changes.outputs.docs_only == 'true'
        run: node --test --test-reporter=spec test/repo/docs/*.test.ts test/repo/architecture.test.ts test/run/notes/translations.test.ts test/run/changelog.test.ts
      - if: needs.changes.outputs.docs_only != 'true'
        run: node --test --test-concurrency=4 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/tests.tap" --test-shard="$SHARD/$OF"
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
      # The time and the slowest tests go in the job summary. It fails far above the slowest run
      # seen: 180 s a shard, or 90 s on Node 24 on Linux, the fastest setup (#475). Node 24 on
      # Linux took 61 to 96 s a shard on 2026-10-26, and fails past 135 s. The one whole-suite
      # macOS job gets 400 s: it took 191 s once, then 419 to 510 s on 2026-10-24,
      # all tests passing, so the suite fails only past 600 s with the room for a busy runner.
      # The slow tests behind that growth are #943's second half (record 0016).
      - if: needs.changes.outputs.docs_only != 'true'
        run: node scripts/time/suite.ts ${{ runner.temp }}/tests.tap ${{ matrix.of == 1 && '--budget 400' || matrix.os == 'ubuntu-latest' && matrix.node == '^24.22.1' && '--budget 90' || '' }}
  # Windows has the most users (owner 2026-10-25), and the hook's job host there broke once
  # with no Windows run to see it (#735, PR #982). The whole suite in one job, on the current
  # LTS. Each test file runs on its own with a four-minute cap, since a few files never ended
  # on Windows and one `node --test` run passed the job's limit (10-25). Tests known to fail
  # there are listed in scripts/time/windows-known.txt (record 0040): a new failure fails the
  # job, and so does a listed test that passes, so the list only gets shorter. Only what
  # native Windows supports runs: TEST_AREAS in scripts/time/windows-known.ts skips the desk, its fence and
  # the kanban server, and the log names each skip's reason. A file that crashes runs once
  # more, and the log shows its stderr and calls it flaky if the second run gets through (#1068).
  # Not in a merge queue group: the pull request ran it, and a push to main runs it again (#1084).
  windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && github.event_name != 'merge_group' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Three machines at once, each with a third of the test files by size: a faster answer,
    # failing or not. Every shard reports, so one failure does not hide another.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^24.22.1'
      - run: node scripts/time/windows-known.ts --shard ${{ matrix.shard }}/3 --out "${{ runner.temp }}/windows-failures.txt" --times "${{ runner.temp }}/windows-times.txt"
        shell: bash
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
      # This run's failures, in the list's own form: copy it over the list to rewrite it.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-failures-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/windows-failures.txt
            ${{ runner.temp }}/windows-times.txt
          retention-days: 7
  # Types are checked here and nowhere else: Node runs the .ts files without them.
  # Skipped on a docs-only pull request.
  typecheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^22.23.4'
      - run: npm ci
      - run: npm run typecheck
      # The copy check (issue #1091): kanban code must not copy a block from elsewhere in
      # src (.jscpd.json: 50 tokens and 5 lines or more). Clones already on the base are
      # known and listed; only a new one fails. A public fetch, so no token is kept.
      - if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"
          npx --no-install jscpd --baseline-from-ref "$BASE_SHA" --fail-on-new-clones
      # The npm package (record 0008): pack it, install it offline, run install, init and doctor.
      - run: npm run check-package
  # The same check as the commit hook, for commits made without it.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The whole history, so a translation note can say how many commits it is behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^22.23.4'
      - run: node bin/yokoten.ts check
  # The workflows themselves: actionlint for mistakes, zizmor for security. These are
  # CI tools only, never a dependency of yokoten.
  # Skipped on a docs-only pull request: it reads only workflow files, and .github/ is never docs-only.
  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pinned release, checked against its hash before it runs.
      - name: actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          # The kit's workflow is linted as `init` writes it: the {{cli}} placeholder filled in.
          mkdir -p "$RUNNER_TEMP/kit"
          for f in kit/project/.github/workflows/*.yml; do
            sed "s|{{cli}}|.yokoten/bin/yokoten.ts|g" "$f" > "$RUNNER_TEMP/kit/$(basename "$f")"
          done
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml "$RUNNER_TEMP"/kit/*.yml
      # Findings fail the job here, as annotations; no upload to code scanning.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
  # The action other repos use (action.yml, #106), run here as they would run it. No
  # `check --pr`: this workflow does not run again when the title or labels change, so a
  # fixed title would leave `ci` red. The `pr` workflow checks the pull request.
  # Skipped on a docs-only pull request.
  action:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # GitHub documents `$/` only with a folder after it, not for an action at the root.
      - uses: ./ # zizmor: ignore[self-repository]
        with:
          pr-check: false
  # The one required check. It runs even when a job it needs failed, and goes red if
  # any of them did not succeed (failed, cancelled or skipped). Two exceptions, skipped on
  # purpose: on a docs-only pull request, `windows`, `typecheck`, `lint` and `action`
  # (#438); in a merge queue group, `windows` and nothing else (#1084).
  # A job that never started is named in the summary, so a queued timeout reads as
  # "no runner was free", not as a test failure (#568).
  ci:
    if: always()
    needs: [changes, test, windows, typecheck, check, lint, action]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      # A job that timed out or was cancelled before any step started never got a
      # runner: the shared macOS runners were busy. Diagnosis only: it never fails
      # this job, so a broken query cannot turn a green run red.
      - if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          starved=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '[.jobs[] | select((.conclusion == "timed_out" or .conclusion == "cancelled") and ([.steps[]? | select(.started_at != null)] | length == 0)) | .name] | unique | join(", ")')
          if [ -n "$starved" ]; then
            echo "::warning::These jobs never started: no runner was free, or they were cancelled while queued. Not test failures: $starved"
            echo "These jobs never started, so this is not a test failure (no runner was free, or they were cancelled while queued): $starved" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (contains(needs.*.result, 'skipped') && needs.changes.outputs.docs_only != 'true' && github.event_name != 'merge_group') ||
          needs.changes.result != 'success' || needs.test.result != 'success' || needs.check.result != 'success' ||
          (needs.changes.outputs.docs_only != 'true' && (needs.typecheck.result != 'success' || needs.lint.result != 'success' || needs.action.result != 'success')) ||
          (needs.windows.result != 'success' && needs.changes.outputs.docs_only != 'true' && github.event_name != 'merge_group')
        run: exit 1
