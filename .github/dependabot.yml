# Monthly, one grouped pull request per kind, so updates don't each cost a review
# (core rule 8). yokoten has no runtime dependencies: these are the type checker and
# the actions CI runs. A release is taken only once it is a week old, so one pulled
# for being bad never reaches us.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dev:
        patterns: ['*']
    # The title needs an area from yokoten.json (Dependabot's own scope, deps-dev, is not one).
    commit-message:
      prefix: chore(repo)
    labels: [ci]
    ignore:
      # @types/node follows the Node floor (22), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # The website (web/site, record 0055): Astro, the Cloudflare Worker tools and their
  # helpers. Not in the npm package, so its own group and pull request.
  - package-ecosystem: npm
    directory: /web/site
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      site:
        patterns: ['*']
    commit-message:
      prefix: chore(site)
    labels: [ci]
    ignore:
      # @astrojs/check 0.9 takes TypeScript 5 or 6; drop this once it takes 7 (issue #1195).
      - dependency-name: typescript
        versions: ['>=7']
  # The promo video tool (web/site/tools/promo): Remotion and React. Local only, but
  # its advisories still get a monthly pull request.
  - package-ecosystem: npm
    directory: /web/site/tools/promo
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      promo:
        patterns: ['*']
    commit-message:
      prefix: chore(site)
    labels: [ci]
  - package-ecosystem: github-actions
    # The repo's own workflows, and the kit's, which every project gets from `init`.
    directories: [/, /kit/project]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    labels: [ci]
