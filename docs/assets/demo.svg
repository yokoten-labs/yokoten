<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1036 494" width="1036" height="494" role="img" aria-labelledby="title" xml:space="preserve">
<title id="title">An agent runs git push --tags. yokoten blocks it and says what happened, why, and what the person does instead. Then yokoten doctor names the next step.</title>
<style>
text{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#e6edf3;white-space:pre}
.l{animation:show .01s both}
.c{animation:type .01s both}
.k{animation:blink 1s step-end infinite}
.a{fill:#ec8f6c}.p{fill:#7ee787}.r{fill:#ff7b72;font-weight:bold}.b{font-weight:bold}.d,.t{fill:#9198a1}.g{fill:#7ee787}.y{fill:#e3b341}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes type{from{fill-opacity:0}to{fill-opacity:1}}
@keyframes blink{50%{fill-opacity:0}}
@media (prefers-reduced-motion:reduce){.l,.c,.k{animation:none}}
</style>
<rect width="1036" height="494" rx="10" fill="#0d1117"/>
<rect x=".5" y=".5" width="1035" height="493" rx="9.5" fill="none" stroke="#3d444d"/>
<path d="M0 34H1036" stroke="#3d444d"/>
<circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="38" cy="17" r="5.5" fill="#febc2e"/><circle cx="56" cy="17" r="5.5" fill="#28c840"/>
<text x="518" y="21" text-anchor="middle" class="t">my-app</text>
<text x="20" y="67" class="l" style="animation-delay:0.6s"><tspan class="a">agent &gt; </tspan><tspan class="c" style="animation-delay:0.9s">g</tspan><tspan class="c" style="animation-delay:0.94s">i</tspan><tspan class="c" style="animation-delay:0.99s">t</tspan><tspan class="c" style="animation-delay:1.03s"> </tspan><tspan class="c" style="animation-delay:1.08s">p</tspan><tspan class="c" style="animation-delay:1.13s">u</tspan><tspan class="c" style="animation-delay:1.17s">s</tspan><tspan class="c" style="animation-delay:1.21s">h</tspan><tspan class="c" style="animation-delay:1.26s"> </tspan><tspan class="c" style="animation-delay:1.3s">-</tspan><tspan class="c" style="animation-delay:1.35s">-</tspan><tspan class="c" style="animation-delay:1.4s">t</tspan><tspan class="c" style="animation-delay:1.44s">a</tspan><tspan class="c" style="animation-delay:1.48s">g</tspan><tspan class="c" style="animation-delay:1.53s">s</tspan><tspan class="c" style="animation-delay:1.57s"> </tspan><tspan class="c" style="animation-delay:1.62s">o</tspan><tspan class="c" style="animation-delay:1.67s">r</tspan><tspan class="c" style="animation-delay:1.71s">i</tspan><tspan class="c" style="animation-delay:1.75s">g</tspan><tspan class="c" style="animation-delay:1.8s">i</tspan><tspan class="c" style="animation-delay:1.84s">n</tspan></text>
<text x="20" y="87" class="l r" style="animation-delay:2.39s">  blocked by the yokoten hook (exit 2)</text>
<text x="20" y="107" class="l" style="animation-delay:2.51s">  yokoten stopped this: git push --tags pushes tags [release]</text>
<text x="20" y="127" class="l" style="animation-delay:2.63s">  Why: Only the owner decides when to release.</text>
<text x="20" y="147" class="l" style="animation-delay:2.75s">  Do instead: Stop and tell the owner: only the owner releases, with the steps in How to release; do not look for another way.</text>
<text x="20" y="167" class="l" style="animation-delay:2.87s">  More: https://github.com/yokoten-labs/yokoten/blob/main/docs/guide.md#how-to-release</text>
<text x="20" y="207" class="l" style="animation-delay:3.99s"><tspan class="p">~/my-app $ </tspan><tspan class="c" style="animation-delay:4.29s">y</tspan><tspan class="c" style="animation-delay:4.34s">o</tspan><tspan class="c" style="animation-delay:4.38s">k</tspan><tspan class="c" style="animation-delay:4.43s">o</tspan><tspan class="c" style="animation-delay:4.47s">t</tspan><tspan class="c" style="animation-delay:4.52s">e</tspan><tspan class="c" style="animation-delay:4.56s">n</tspan><tspan class="c" style="animation-delay:4.61s"> </tspan><tspan class="c" style="animation-delay:4.65s">d</tspan><tspan class="c" style="animation-delay:4.7s">o</tspan><tspan class="c" style="animation-delay:4.74s">c</tspan><tspan class="c" style="animation-delay:4.79s">t</tspan><tspan class="c" style="animation-delay:4.83s">o</tspan><tspan class="c" style="animation-delay:4.88s">r</tspan></text>
<text x="20" y="227" class="l" style="animation-delay:5.42s">yokoten 0.1.0, self-test ok</text>
<text x="20" y="247" class="l b" style="animation-delay:5.54s">the road: stage 1 of 5, safety net</text>
<text x="20" y="267" class="l" style="animation-delay:5.66s">  1. safety net</text>
<text x="20" y="287" class="l" style="animation-delay:5.78s">    <tspan class="g">done</tspan>        rules (OpenSSF: AI code assistant instructions)</text>
<text x="20" y="307" class="l" style="animation-delay:5.9s">    <tspan class="g">done</tspan>        tool-hook</text>
<text x="20" y="327" class="l" style="animation-delay:6.02s">    <tspan class="g">done</tspan>        commit-check (OSPS-BR-07.01)</text>
<text x="20" y="347" class="l" style="animation-delay:6.14s">    <tspan class="g">done</tspan>        runtime</text>
<text x="20" y="367" class="l" style="animation-delay:6.26s">    <tspan class="y">next</tspan>        tests (Best Practices: test): no test command: no "test" script</text>
<text x="20" y="387" class="l" style="animation-delay:6.38s">                in package.json, and no workflow runs a test runner; add tests</text>
<text x="20" y="407" class="l" style="animation-delay:6.5s">                and a CI step that runs them</text>
<text x="20" y="427" class="l" style="animation-delay:6.62s">  2. issues and pull requests</text>
<text x="20" y="447" class="l d" style="animation-delay:6.74s">  ...</text>
<text x="20" y="467" class="l" style="animation-delay:6.86s"><tspan class="p">~/my-app $ </tspan><tspan class="k">█</tspan></text>
</svg>
